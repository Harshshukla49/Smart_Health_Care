<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <title>Smart Health Care — Remote Patient Monitoring & Telehealth</title>
    <meta
      name="description"
      content="Enterprise-grade remote patient monitoring, emergency telemetry, live hospital discovery, and clinical healthcare platform."
    />
    
    <!-- PWA Web App Manifest & App Identity -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- iOS / Safari PWA Optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Health Care" />
    <meta name="application-name" content="Smart Health Care" />
    <meta name="msapplication-TileColor" content="#0284c7" />

    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get('redirect') || sessionStorage.getItem('spa_redirect_path');
          if (redirect) {
            sessionStorage.removeItem('spa_redirect_path');
            window.history.replaceState(null, null, redirect);
          }
        } catch (e) {}

        // Register Service Worker in production/supporting environments
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                console.log('[PWA] Service Worker registered with scope:', reg.scope);
                // Listen for updates
                reg.onupdatefound = function() {
                  var installingWorker = reg.installing;
                  if (installingWorker) {
                    installingWorker.onstatechange = function() {
                      if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        console.log('[PWA] New Smart Health Care version available.');
                      }
                    };
                  }
                };
              })
              .catch(function(err) {
                console.warn('[PWA] Service Worker registration skipped or failed:', err);
              });
          });
        }
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #0f172a;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div style="width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, #0284c7, #0d9488); display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 12px 28px rgba(2, 132, 199, 0.4);">
            🏥
          </div>
          <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff;">
            Smart Health Care
          </div>
          <div style="font-size: 13px; color: #94a3b8; font-weight: 500;">
            Connecting to clinical telemetry hub...
          </div>
          <div style="width: 140px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin-top: 8px;">
            <div style="width: 100%; height: 100%; background: linear-gradient(90deg, transparent, #38bdf8, transparent); animation: pulse-bar 1.2s infinite ease-in-out;"></div>
          </div>
        </div>
        <style>
          @keyframes pulse-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
