<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Healthcare Remote Monitoring System</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path && path !== '/') {
          sessionStorage.setItem('spa_redirect_path', path + search + hash);
          window.location.replace('/?redirect=' + encodeURIComponent(path + search + hash));
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body style="margin: 0; background: #0F172A; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="text-align: center;">
      <div style="width: 48px; height: 48px; border: 3px solid rgba(56, 189, 248, 0.3); border-top-color: #38BDF8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
      <div style="font-size: 16px; font-weight: 600; color: #E2E8F0;">Loading Smart Healthcare Portal...</div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
